<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gikeon — Applications</title>
  <meta name="description" content="Gikeon — éditeur de l'application Aurore : Citations & Sagesse." />
  <style>
    :root {
      --bg: #1a1830;
      --card: #25224a;
      --text: #f4f2ff;
      --muted: #b8b3d9;
      --accent: #8b83ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(ellipse at top, #2e2b5f 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
    }
    main {
      width: min(36rem, 100%);
      background: color-mix(in srgb, var(--card) 88%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
      border-radius: 1.25rem;
      padding: 2rem 1.75rem;
    }
    .brand {
      font-size: clamp(2rem, 6vw, 2.75rem);
      letter-spacing: 0.04em;
      margin: 0 0 0.35rem;
    }
    p { color: var(--muted); line-height: 1.55; margin: 0.75rem 0; }
    a { color: var(--accent); }
    ul { padding-left: 1.1rem; color: var(--muted); line-height: 1.7; }
    .meta { margin-top: 1.75rem; font-size: 0.95rem; }
  </style>
</head>
<body>
  <main>
    <h1 class="brand">Gikeon</h1>
    <p>Éditeur d’applications mobiles.</p>
    <p><strong style="color: var(--text)">Aurore : Citations &amp; Sagesse</strong> — citations quotidiennes, catégories, favoris et journal personnel.</p>
    <ul>
      <li><a href="https://play.google.com/store/apps/details?id=com.gikeon.aurore">Voir sur Google Play</a></li>
      <li><a href="https://sites.google.com/view/aurore-privacy/home">Politique de confidentialité</a></li>
      <li><a href="./app-ads.txt">app-ads.txt</a></li>
    </ul>
    <p class="meta">Contact : via la fiche Google Play de l’application.</p>
  </main>
</body>
</html>
